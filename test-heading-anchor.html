<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Heading Anchor Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      max-width: 1200px;
    }
    .test-section {
      border: 1px solid #ddd;
      padding: 15px;
      margin: 15px 0;
      border-radius: 5px;
    }
    .test-section h2 {
      margin-top: 0;
      color: #2c3e50;
    }
    .log-output {
      background: #f5f5f5;
      padding: 10px;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      white-space: pre-wrap;
      max-height: 400px;
      overflow-y: auto;
    }
    .pass { color: green; font-weight: bold; }
    .fail { color: red; font-weight: bold; }
    .info { color: blue; }
    button {
      background: #3498db;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      margin: 5px;
    }
    button:hover {
      background: #2980b9;
    }
    iframe {
      width: 100%;
      height: 600px;
      border: 1px solid #ddd;
      margin: 10px 0;
    }
    .screenshot {
      max-width: 100%;
      border: 2px solid #333;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <h1>Heading Anchor Feature Test</h1>

  <div class="test-section">
    <h2>Test Controls</h2>
    <button onclick="runTest()">Run Test</button>
    <button onclick="clearLog()">Clear Log</button>
  </div>

  <div class="test-section">
    <h2>Test Results</h2>
    <div id="log" class="log-output">Click "Run Test" to start testing...</div>
  </div>

  <div class="test-section">
    <h2>Application View</h2>
    <iframe id="testFrame" src="http://localhost:3000"></iframe>
  </div>

  <script>
    let logOutput = '';

    function log(message, type = 'info') {
      const timestamp = new Date().toLocaleTimeString();
      const prefix = type === 'pass' ? '✓' : type === 'fail' ? '✗' : 'ℹ';
      logOutput += `[${timestamp}] ${prefix} ${message}\n`;
      document.getElementById('log').innerHTML = `<pre>${logOutput}</pre>`;
    }

    function clearLog() {
      logOutput = '';
      document.getElementById('log').innerHTML = '<pre>Log cleared. Click "Run Test" to start testing...</pre>';
    }

    async function runTest() {
      clearLog();
      log('Starting heading anchor test...', 'info');

      const frame = document.getElementById('testFrame');
      const win = frame.contentWindow;
      const doc = frame.contentDocument;

      try {
        // Step 1: Navigate to home
        log('Step 1: Loading home page...', 'info');
        await new Promise(resolve => setTimeout(resolve, 2000));
        log('Page loaded', 'pass');

        // Step 2: Click guide folder
        log('Step 2: Looking for "guide" folder...', 'info');
        const guideFolder = Array.from(doc.querySelectorAll('.tree-item.directory')).find(el =>
          el.textContent.includes('guide')
        );

        if (!guideFolder) {
          log('❌ FAIL: Could not find "guide" folder', 'fail');
          return;
        }

        log('Found guide folder, clicking...', 'info');
        guideFolder.click();
        await new Promise(resolve => setTimeout(resolve, 1000));
        log('Guide folder clicked', 'pass');

        // Step 3: Click programming-samples file
        log('Step 3: Looking for "programming-samples" file...', 'info');
        const samplesFile = Array.from(doc.querySelectorAll('.tree-item.file')).find(el =>
          el.textContent.includes('programming-samples')
        );

        if (!samplesFile) {
          log('❌ FAIL: Could not find "programming-samples" file', 'fail');
          return;
        }

        log('Found programming-samples file, clicking...', 'info');
        samplesFile.click();
        await new Promise(resolve => setTimeout(resolve, 2000));
        log('File loaded', 'pass');

        // Step 4: Check console logs (capture from iframe)
        log('Step 4: Checking console logs...', 'info');

        // Override console.log in iframe to capture logs
        const originalLog = win.console.log;
        const consoleLogs = [];
        win.console.log = function(...args) {
          consoleLogs.push(args.join(' '));
          originalLog.apply(win.console, args);
        };

        // Step 5: Find and click first h2 heading
        log('Step 5: Looking for first h2 heading...', 'info');
        const h2 = doc.querySelector('.markdown-content h2');

        if (!h2) {
          log('❌ FAIL: No h2 found in content', 'fail');
          return;
        }

        const headingId = h2.id;
        const headingText = h2.textContent;
        log(`Found h2: "${headingText}" (id: ${headingId})`, 'info');

        if (!headingId) {
          log('❌ FAIL: h2 does not have an ID', 'fail');
          return;
        }

        log('Clicking h2 heading...', 'info');
        h2.click();

        // Step 6: Wait and check results
        await new Promise(resolve => setTimeout(resolve, 500));

        log('Step 6: Checking results...', 'info');

        // Check URL
        const currentUrl = win.location.href;
        const urlHasHash = currentUrl.includes('#');
        const hash = win.location.hash;

        log(`Current URL: ${currentUrl}`, 'info');
        log(`URL has hash: ${urlHasHash}`, urlHasHash ? 'pass' : 'fail');
        log(`Hash: ${hash}`, 'info');

        if (!urlHasHash) {
          log('❌ FAIL: URL does not contain hash', 'fail');
        } else if (hash === `#${headingId}`) {
          log(`✓ PASS: URL hash matches heading ID`, 'pass');
        } else {
          log(`❌ FAIL: URL hash (${hash}) does not match heading ID (#${headingId})`, 'fail');
        }

        // Check anchor icon
        const anchorIcon = h2.querySelector('.heading-anchor');
        if (anchorIcon) {
          log(`Anchor icon found: ${anchorIcon.innerHTML}`, 'info');
          if (anchorIcon.innerHTML === '✓') {
            log('✓ PASS: Icon changed to checkmark', 'pass');
          } else {
            log('ℹ INFO: Icon is still link emoji (may change after click)', 'info');
          }
        } else {
          log('❌ FAIL: No anchor icon found', 'fail');
        }

        // Check hover underline
        log('Step 7: Testing hover effect...', 'info');
        const computedStyle = win.getComputedStyle(h2);
        h2.dispatchEvent(new MouseEvent('mouseenter', { bubbles: true }));
        await new Promise(resolve => setTimeout(resolve, 100));

        const hoverStyle = win.getComputedStyle(h2);
        log(`Text decoration: ${hoverStyle.textDecoration}`, 'info');
        log(`Cursor: ${hoverStyle.cursor}`, 'info');

        if (hoverStyle.cursor === 'pointer') {
          log('✓ PASS: Heading has pointer cursor', 'pass');
        } else {
          log('❌ FAIL: Heading does not have pointer cursor', 'fail');
        }

        // Check console logs
        log('Step 8: Console logs captured:', 'info');
        if (consoleLogs.length > 0) {
          consoleLogs.forEach(logMsg => {
            log(`  Console: ${logMsg}`, 'info');
          });
        } else {
          log('  No console.log calls captured', 'info');
        }

        // Summary
        log('\n=== TEST SUMMARY ===', 'info');
        log('Expected behaviors:', 'info');
        log(`  1. URL should contain hash: ${urlHasHash ? '✓' : '✗'}`, urlHasHash ? 'pass' : 'fail');
        log(`  2. Hash should match heading ID: ${hash === `#${headingId}` ? '✓' : '✗'}`, hash === `#${headingId}` ? 'pass' : 'fail');
        log(`  3. Icon should change to ✓: ${anchorIcon && anchorIcon.innerHTML === '✓' ? '✓' : '?'}`, anchorIcon && anchorIcon.innerHTML === '✓' ? 'pass' : 'info');
        log(`  4. Heading should have pointer cursor: ${hoverStyle.cursor === 'pointer' ? '✓' : '✗'}`, hoverStyle.cursor === 'pointer' ? 'pass' : 'fail');

        log('\nTest completed!', 'info');

      } catch (error) {
        log(`❌ ERROR: ${error.message}`, 'fail');
        log(`Stack: ${error.stack}`, 'fail');
      }
    }
  </script>
</body>
</html>
